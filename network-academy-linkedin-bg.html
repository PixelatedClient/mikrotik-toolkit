<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Academy - LinkedIn Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 400px;
            background: linear-gradient(180deg, #0a0e2a 0%, #141850 15%, #1c2266 30%, #262e80 50%, #1b2456 100%);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05) 0px,
                rgba(0, 0, 0, 0.05) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Color strip at top */
        .color-strip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff006e 0%, #fb5607 20%, #ffbe0b 40%, #8338ec 60%, #3a86ff 80%, #06ffa5 100%);
            z-index: 20;
        }

        .content {
            display: flex;
            height: 100%;
            padding-top: 8px;
            position: relative;
            z-index: 1;
        }

        /* Left section - text */
        .left {
            flex: 0.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 40px;
            z-index: 5;
        }

        .logo {
            font-size: 10px;
            color: #ffd23f;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .title {
            font-size: 18px;
            color: #f2f4ff;
            margin-bottom: 6px;
            line-height: 1.2;
            font-weight: bold;
        }

        .subtitle {
            font-size: 6px;
            color: #aab4e0;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .desc {
            font-size: 5px;
            color: #aab4e0;
            line-height: 1.4;
            max-width: 250px;
        }

        /* Right section - game scene */
        .right {
            flex: 0.6;
            position: relative;
            overflow: hidden;
        }

        /* Sky gradient */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35%;
            background: linear-gradient(180deg, #141850 0%, #1c2266 50%, #262e80 100%);
        }

        /* Clouds */
        .cloud {
            position: absolute;
            opacity: 0.7;
        }

        .cloud1 {
            width: 60px;
            height: 20px;
            background: #e6eaff;
            top: 40px;
            right: 150px;
            clip-path: polygon(0 50%, 20% 0%, 80% 0%, 100% 50%, 100% 100%, 0 100%);
        }

        .cloud2 {
            width: 80px;
            height: 18px;
            background: #cfd6ff;
            top: 70px;
            left: 100px;
            clip-path: polygon(0 50%, 20% 0%, 80% 0%, 100% 50%, 100% 100%, 0 100%);
        }

        /* Landscape/Meadow */
        .landscape {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65%;
            background: linear-gradient(180deg, #8fd0ff 0%, #7ac0ff 30%, #6eb3ff 100%);
            clip-path: polygon(0 30%, 100% 35%, 100% 100%, 0 100%);
        }

        .meadow-base {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20%;
            background: linear-gradient(180deg, #2f8f4e 0%, #267a41 100%);
        }

        /* Mountains - left */
        .mountain-left {
            position: absolute;
            bottom: 20%;
            left: 30px;
            width: 120px;
            height: 100px;
            background: linear-gradient(135deg, #3a3f8f 0%, #464cab 100%);
            clip-path: polygon(0 100%, 50% 0%, 100% 100%);
            opacity: 0.9;
        }

        .mountain-left::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 8px,
                rgba(70, 76, 171, 0.3) 8px,
                rgba(70, 76, 171, 0.3) 10px
            );
        }

        /* Mountains - center */
        .mountain-center {
            position: absolute;
            bottom: 15%;
            left: 45%;
            transform: translateX(-50%);
            width: 180px;
            height: 120px;
            background: linear-gradient(135deg, #33387f 0%, #3d4399 100%);
            clip-path: polygon(0 100%, 50% 0%, 100% 100%);
            opacity: 0.85;
        }

        .mountain-center::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(61, 67, 153, 0.3) 10px,
                rgba(61, 67, 153, 0.3) 12px
            );
        }

        /* Castle */
        .castle {
            position: absolute;
            bottom: 20%;
            right: 80px;
            width: 70px;
            height: 90px;
            z-index: 3;
        }

        .castle-tower {
            position: absolute;
            background: #5a2a3a;
            width: 18px;
        }

        .tower-left {
            height: 90px;
            left: 8px;
            bottom: 0;
            clip-path: polygon(0 0%, 100% 5%, 100% 100%, 0 100%);
        }

        .tower-right {
            height: 90px;
            right: 8px;
            bottom: 0;
            clip-path: polygon(0 5%, 100% 0%, 100% 100%, 0 100%);
        }

        .castle-wall {
            position: absolute;
            bottom: 0;
            left: 16px;
            width: 38px;
            height: 60px;
            background: #6e3346;
        }

        .castle-flag {
            position: absolute;
            top: -8px;
            right: 18px;
            width: 10px;
            height: 12px;
            background: #ff5a5a;
        }

        .window {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ff9a3a;
            border: 1px solid #5a2a3a;
            box-shadow: 0 0 3px #ff9a3a;
        }

        .window1 { top: 30px; left: 22px; }
        .window2 { top: 30px; right: 22px; }
        .window3 { top: 50px; left: 28px; }

        /* PKT - Main character */
        .pkt-container {
            position: absolute;
            bottom: 25%;
            left: 50px;
            width: 60px;
            height: 70px;
            z-index: 4;
        }

        /* PKT body */
        .pkt-body {
            position: absolute;
            width: 40px;
            height: 32px;
            background: #ffd23f;
            left: 10px;
            top: 24px;
            border: 2px solid #fff0a8;
        }

        .pkt-body-bottom {
            position: absolute;
            width: 40px;
            height: 8px;
            background: #238a48;
            left: 10px;
            top: 54px;
            border-left: 2px solid #1d6b3a;
            border-right: 2px solid #1d6b3a;
        }

        /* PKT head */
        .pkt-head {
            position: absolute;
            width: 32px;
            height: 24px;
            background: #ffd23f;
            left: 14px;
            top: 2px;
            border: 2px solid #fff0a8;
        }

        /* Antennae */
        .antenna {
            position: absolute;
            width: 4px;
            background: #ffd23f;
            left: 50%;
            top: -12px;
        }

        .antenna-left {
            height: 16px;
            transform: translateX(-10px) rotate(-20deg);
            border-left: 2px solid #fff0a8;
        }

        .antenna-right {
            height: 16px;
            transform: translateX(6px) rotate(20deg);
            border-right: 2px solid #fff0a8;
        }

        /* Eyes */
        .eye {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #0a0e2a;
            top: 8px;
        }

        .eye-left { left: 10px; }
        .eye-right { right: 10px; }

        .eye::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 1px;
            background: #ffffff;
            top: 1px;
            right: 1px;
        }

        /* LED */
        .led {
            position: absolute;
            width: 4px;
            height: 2px;
            background: #ff7a3a;
            left: 50%;
            transform: translateX(-50%);
            bottom: 6px;
            box-shadow: 0 0 3px #ff7a3a;
            animation: led-blink 1.2s infinite;
        }

        @keyframes led-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Flying packets */
        .packet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff0a8;
            border: 1px solid #ffd23f;
            box-shadow: 0 0 4px #ffd23f;
            animation: packet-fly 6s infinite;
        }

        .packet1 {
            top: 120px;
            left: 80%;
            animation-delay: 0s;
        }

        .packet2 {
            top: 140px;
            left: 75%;
            animation-delay: 1.5s;
        }

        .packet3 {
            top: 100px;
            left: 85%;
            animation-delay: 3s;
        }

        @keyframes packet-fly {
            0% {
                left: 110%;
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                left: -5%;
                opacity: 0;
            }
        }

        /* Road */
        .road {
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            height: 8px;
            background: #d9b36a;
            border-top: 2px solid #f0cf8a;
            z-index: 2;
        }

        .road-line {
            position: absolute;
            height: 2px;
            background: repeating-linear-gradient(90deg, #f0cf8a 0px, #f0cf8a 30px, transparent 30px, transparent 50px);
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Dragon - small, background */
        .dragon-bg {
            position: absolute;
            top: 45%;
            right: 180px;
            width: 50px;
            height: 35px;
            opacity: 0.6;
            z-index: 1;
        }

        .dragon-body {
            position: absolute;
            width: 30px;
            height: 16px;
            background: #3aa655;
            left: 12px;
            top: 12px;
            border: 1px solid #267a41;
        }

        .dragon-head {
            position: absolute;
            width: 16px;
            height: 14px;
            background: #3aa655;
            right: 12px;
            top: 8px;
            border: 1px solid #267a41;
        }

        .dragon-horn {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #f0cf8a;
            right: 16px;
            top: 4px;
        }

        .dragon-eye {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #0a0e2a;
            right: 14px;
            top: 10px;
        }

        .dragon-tail {
            position: absolute;
            width: 16px;
            height: 2px;
            background: #267a41;
            left: 10px;
            top: 15px;
        }
    </style>
</head>
<body>
    <div class="color-strip"></div>

    <div class="content">
        <!-- Left: Text -->
        <div class="left">
            <div class="logo">> NETWORK ACADEMY</div>
            <div class="title">Route the<br>Traffic Break<br>the Firewall</div>
            <div class="subtitle">INTERACTIVE GAME</div>
            <div class="desc">
                Fix subnets. Lay routes.<br>
                Write firewall rules.<br>
                Learn by doing.
            </div>
        </div>

        <!-- Right: Game scene -->
        <div class="right">
            <div class="sky"></div>
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>

            <div class="landscape"></div>

            <!-- Mountains -->
            <div class="mountain-left"></div>
            <div class="mountain-center"></div>

            <!-- Dragon in background -->
            <div class="dragon-bg">
                <div class="dragon-body"></div>
                <div class="dragon-head">
                    <div class="dragon-horn"></div>
                    <div class="dragon-eye"></div>
                </div>
                <div class="dragon-tail"></div>
            </div>

            <!-- Castle -->
            <div class="castle">
                <div class="castle-tower tower-left"></div>
                <div class="castle-tower tower-right"></div>
                <div class="castle-wall"></div>
                <div class="castle-flag"></div>
                <div class="window window1"></div>
                <div class="window window2"></div>
                <div class="window window3"></div>
            </div>

            <!-- Road -->
            <div class="road">
                <div class="road-line"></div>
            </div>

            <!-- Meadow -->
            <div class="meadow-base"></div>

            <!-- PKT -->
            <div class="pkt-container">
                <div class="pkt-head">
                    <div class="antenna antenna-left"></div>
                    <div class="antenna antenna-right"></div>
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                </div>
                <div class="pkt-body">
                    <div class="led"></div>
                </div>
                <div class="pkt-body-bottom"></div>
            </div>

            <!-- Flying packets -->
            <div class="packet packet1"></div>
            <div class="packet packet2"></div>
            <div class="packet packet3"></div>
        </div>
    </div>
</body>
</html>
